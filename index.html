<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅貼">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>旅貼</title>
<style>
:root{
  color-scheme:light;
  --ink:#14213D; --sun:#FFC93C; --bg:#E6EAF0; --card:#fff; --mute:#5A6578; --line:#D5DBE4; --blue:#3F6FE0;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(92px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);padding:6px 16px calc(6px + env(safe-area-inset-bottom))}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tab{height:52px;border-radius:14px;color:#AEB8CC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--sun);background:rgba(255,255,255,.1)}

/* start */
.start{padding-top:28px;display:grid;gap:14px}
.start h1{font-size:34px;font-weight:900;letter-spacing:.02em;line-height:1.2}
.sub{color:var(--mute);font-size:15px;max-width:30ch}
.start label{display:grid;gap:6px;font-weight:700;font-size:14px}
.start input{height:52px;border:2px solid var(--ink);border-radius:14px;background:#fff;padding:0 14px;font-size:18px;font-weight:600}
.primary{height:56px;border-radius:16px;background:var(--sun);color:var(--ink);font-weight:900;font-size:18px;box-shadow:0 4px 0 var(--ink);border:2px solid var(--ink)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ghost{height:40px;padding:0 14px;border-radius:12px;border:2px solid var(--ink);font-weight:800;font-size:14px;background:transparent}

/* trip */
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hd h1{font-size:26px;font-weight:900;line-height:1.2;overflow-wrap:anywhere}
.hd p{color:var(--mute);font-size:14px;font-weight:600}
.sum{margin:14px 0}
.sum .lab{font-size:14px;font-weight:700;color:var(--mute)}
.big{font-size:46px;font-weight:900;line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.big span{font-size:18px;font-weight:800;margin-right:8px;color:var(--mute)}
.mini{display:flex;gap:18px;font-size:14px;font-weight:700;color:var(--mute);margin-top:4px}
.pad{background:var(--card);border-radius:22px;padding:14px;display:grid;gap:12px;box-shadow:0 2px 0 var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:3px}
.seg button{height:36px;border-radius:10px;font-weight:800;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.disp{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px}
.disp small{font-size:15px;font-weight:800;color:var(--mute)}
.disp b{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15;overflow:hidden;text-overflow:ellipsis}
.disp.empty b{color:#B3BCCB}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chip{height:56px;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;gap:1px}
.chip span{font-size:20px;line-height:1.1}
.chip.on{background:var(--ink);color:#fff}
.note{height:44px;border:2px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;width:100%;background:#fff}
.keys{display:grid;grid-template-columns:3fr 1.1fr;gap:8px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:52px;border-radius:12px;background:var(--bg);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.key:active{background:var(--line)}
.side{display:grid;grid-template-rows:52px 1fr;gap:8px}
.side .bs{border-radius:12px;background:var(--bg);font-size:20px;font-weight:800}
.side .add{border-radius:14px;background:var(--sun);border:2px solid var(--ink);font-weight:900;font-size:18px;line-height:1.25;box-shadow:0 3px 0 var(--ink)}
.side .add:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.list{margin-top:20px}
.day{font-size:13px;font-weight:800;color:var(--mute);margin:16px 2px 6px}
.row{display:grid;grid-template-columns:40px 1fr auto auto;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:8px 6px 8px 8px;margin-bottom:6px}
.ro{grid-template-columns:40px 1fr auto;padding-right:12px}
.ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px}
.tx{min-width:0}
.tx b{display:block;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{color:var(--mute);font-size:12px;font-weight:600}
.am{font-weight:800;font-variant-numeric:tabular-nums}
.am.in{color:#14795F}
.del{width:36px;height:36px;border-radius:10px;font-size:22px;color:var(--mute)}
.empty-note{color:var(--mute);font-size:14px;margin:20px 2px}

/* book */
.bk h1{font-size:30px;font-weight:900;line-height:1.2}
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;width:min(100%,340px);aspect-ratio:3/4.3;margin:10px auto 0;padding:28px 24px 28px 36px;border-radius:8px 22px 22px 8px;color:#E8C26A;text-align:center;
  background:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.12),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 5px),#14213D;
  box-shadow:inset 12px 0 0 rgba(0,0,0,.3),inset 14px 0 0 rgba(255,255,255,.07),0 22px 30px -14px rgba(20,33,61,.6)}
.cover:active{transform:scale(.99)}
.cover svg{width:96px;height:96px;fill:none;stroke:#E8C26A;stroke-width:2;opacity:.95}
.ct{font-size:54px;font-weight:900;letter-spacing:.18em;margin-right:-.18em;line-height:1.1;text-shadow:0 1px 0 rgba(0,0,0,.45)}
.cs{font-size:15px;font-weight:700;letter-spacing:.5em;margin-right:-.5em}
.cc{margin-top:18px;font-size:14px;font-weight:700;color:#F3DFA6;border:1.5px solid rgba(232,194,106,.5);border-radius:999px;padding:8px 16px}
.blank{margin-top:28px;display:grid;gap:12px;justify-items:center;text-align:center}
.blank h2{font-size:20px;font-weight:900}
.page{--u:clamp(10px,calc((min(100vw,480px) - 132px) / 18),16px);position:relative;border-radius:6px 16px 16px 6px;padding:58px 24px 40px 32px;display:grid;gap:34px;min-height:660px;align-content:start;transform-origin:left center;
  background:radial-gradient(circle at 15% 85%,rgba(217,120,150,.20),transparent 50%),radial-gradient(circle at 85% 15%,rgba(80,130,200,.22),transparent 55%),repeating-radial-gradient(circle at 50% 130%,rgba(63,111,224,.08) 0 1px,transparent 1px 7px),#F4F2F8;
  box-shadow:inset 8px 0 14px -8px rgba(20,33,61,.28),0 2px 0 var(--line)}
.pn{position:absolute;top:8px;right:16px;font-size:34px;font-weight:900;color:transparent;-webkit-text-stroke:1.5px rgba(63,111,224,.38);font-variant-numeric:tabular-nums}
.pt{position:absolute;top:18px;left:26px;font-size:13px;font-weight:800;letter-spacing:.2em;color:#6B7590}
.slot{display:grid;place-items:center}
.slot button{display:block;padding:8px;border-radius:10px;max-width:100%}
.slot .st{font-size:var(--u)}
.slot.multi{gap:6px}
.grp{position:relative;width:calc(var(--u) * 18 + 16px);height:calc(var(--u) * 17 + 16px)}
.grp>button{position:absolute;padding:3px;border-radius:8px}
.slot .grp .st{font-size:calc(var(--u) * var(--k))}
.grp>button.sub{z-index:2}
/* 45% 小貼紙：名稱固定用最大字級（375 寬約 10px），長名自動換行 */
.grp>button.sub .sc .nm{font-size:1.7em!important}
.grp-cap{font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.05em;text-align:center}
.slot.empty{justify-self:center;width:calc(var(--u) * 18);height:calc(var(--u) * 17);border:2px dashed rgba(90,101,120,.4);border-radius:10px;color:var(--mute);font-size:14px;font-weight:700}
.turn-n{animation:turnN .38s ease-out}
.turn-p{animation:turnP .38s ease-out}
@keyframes turnN{from{transform:perspective(900px) rotateY(-55deg);opacity:.3}to{transform:none;opacity:1}}
@keyframes turnP{from{transform:perspective(900px) rotateY(40deg);opacity:.3}to{transform:none;opacity:1}}
.pg{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:10px;margin-top:16px}
.pg button{height:52px;border-radius:16px;background:var(--ink);color:var(--sun);font-size:22px;font-weight:900}
.pg button:disabled{opacity:.3;cursor:default}
.pg p{text-align:center;font-weight:800;font-size:14px;color:var(--mute)}

/* sticker: squarer landing-permission style with a local landmark scene */
.st{position:relative;width:18em;height:17em;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);border:.14em solid var(--ac);border-radius:.5em;box-shadow:0 0 0 .35em rgba(255,255,255,.92),0 .25em .6em .2em rgba(20,33,61,.25)}
.st::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.38) 0 .15em,transparent .15em .6em);pointer-events:none}
.st>*{position:relative}
.sh{flex:none;display:flex;justify-content:space-between;align-items:center;gap:.6em;background:var(--ac);color:#fff;padding:.35em .8em;font-weight:800}
.sh span:first-child{letter-spacing:.15em}
.sh span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{position:relative;flex:none;line-height:0;background:var(--bg)}
.sc .nm{position:absolute;z-index:1;top:.55em;left:.5em;max-width:56%;color:#14213D;text-shadow:0 1px 5px rgba(255,255,255,.5);white-space:normal;overflow-wrap:anywhere}
.sc svg{display:block;width:100%;height:auto}
.st .bar{flex:none;height:.5em;display:flex;gap:.1em;background:#fff}
.st .bar i{display:block}
.sf{flex:1;min-height:0;display:flex;justify-content:space-between;align-items:flex-end;gap:.8em;padding:.5em .8em .6em}
.sm{display:flex;flex-direction:column;gap:.2em;min-width:0;flex:1}
.st .nm{font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st small{font-size:.9em;font-weight:700;color:rgba(20,33,61,.72);white-space:nowrap}
.am2{display:flex;gap:1.1em;min-width:0;margin-top:.2em}
.am2 div{display:grid}
.am2 b{font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
.am2 div:last-child b{font-size:1.1em}
.qr{width:3.4em;height:3.4em;flex:none;color:var(--ink)}
.qr svg{display:block;width:100%;height:100%}

/* layer */
#layer{position:fixed;inset:0;z-index:30;display:none}
#layer.show{display:block}
.reveal{height:100%;background:rgba(20,33,61,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;color:#fff}
.reveal h2{font-size:28px;font-weight:900}
.reveal p{color:#C9D2E3;font-size:15px}
.reveal .primary{width:min(320px,100%)}
.stamp{animation:stamp .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{0%{transform:scale(1.9) rotate(-14deg);opacity:0}55%{opacity:1}100%{transform:none;opacity:1}}
.dialog{height:100%;background:rgba(20,33,61,.6);display:grid;place-items:end center;padding:16px}
.dlg{background:#fff;border-radius:24px;padding:22px;width:min(460px,100%);display:grid;gap:14px;margin-bottom:env(safe-area-inset-bottom)}
.dlg h2{font-size:22px;font-weight:900}
.dlg p{color:var(--mute);font-size:15px}
.dlg .two{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.dlg .primary,.dlg .ghost{height:50px;font-size:16px}
.sheet{height:100%;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.sheet .wrap{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(32px + env(safe-area-inset-bottom))}
.sheet .top{display:flex;justify-content:flex-end}
.stage{display:grid;place-items:center;padding:20px 0 26px}
.panel{background:#fff;border-radius:18px;padding:6px 14px;margin-bottom:14px}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-weight:700}
.kv:last-child{border-bottom:0}
.kv span{color:var(--mute);font-weight:600}
.br{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;padding:9px 0;font-size:14px;font-weight:700}
.tr{height:10px;border-radius:6px;background:var(--bg);overflow:hidden}
.tr i{display:block;height:100%;border-radius:6px}
.acts{display:grid;gap:10px;margin-top:6px}
.dh{font-size:20px;font-weight:900;margin:22px 2px 0}
.dayh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:16px 2px 6px}
.dayh b{font-size:15px;font-weight:900}
.dayh span{font-size:13px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.dbar{height:6px;border-radius:4px;background:#fff;margin:0 2px 8px;overflow:hidden}
.dbar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.empty-day{color:var(--mute);font-size:13px;margin:0 2px 6px}
.danger{color:#B3261E;border-color:#B3261E}

/* planning + ledger */
.sec{font-size:18px;font-weight:900;margin:10px 0 -4px}
.start .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.start input,.start textarea{min-width:0;width:100%}
.start textarea{border:2px solid var(--ink);border-radius:14px;background:#fff;padding:10px 12px;font-size:16px;line-height:1.4;resize:vertical;font-family:inherit}
.tcard{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px;text-align:left;box-shadow:0 2px 0 var(--line);width:100%}
.tcard b{display:block;font-size:18px;font-weight:900;overflow-wrap:anywhere}
.tcard small{color:var(--mute);font-size:13px;font-weight:600}
.bdg{flex:none;border-radius:999px;background:var(--ink);color:var(--sun);font-size:12px;font-weight:800;padding:6px 10px}
.bdg.od{background:#B3261E;color:#fff}
.pday{display:grid;gap:6px}
.pday b{font-size:14px;font-weight:800}
.dpg{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;margin:14px 0 4px}
.dpg button{height:44px;border-radius:14px;background:var(--ink);color:var(--sun);font-size:22px;font-weight:900}
.dpg button:disabled{opacity:.3;cursor:default}
.dpg div{text-align:center;font-weight:900;font-size:17px}
.bud{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;font-weight:700;color:var(--mute);margin-top:6px}
.over{color:#B3261E}
.dn{margin:12px 0;background:var(--card);border-radius:14px;padding:10px 12px}
.dn summary{font-weight:800;font-size:14px;cursor:pointer}
.dn textarea{margin-top:8px;width:100%;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;font-family:inherit;resize:vertical}
.dnote{margin:0 2px 6px;font-size:13px;color:var(--mute)}
.foot{display:grid;gap:10px;margin-top:22px}


/* two-page trip creation: illustrated destination index */
.dest-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.step-label{font-size:13px;font-weight:800;color:var(--mute)}
.dest-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:4px}
.dest-choice{text-align:left;border:2px solid var(--ink);border-radius:16px;overflow:hidden;background:white;transition:transform .15s}
.dest-choice:active{transform:scale(.97)}
.dest-art{display:block;width:100%;height:88px;background:#dce7ee}
.dest-choice .dest-copy{display:block;padding:10px 12px 12px}
.dest-choice b{display:block;font-size:20px;font-weight:900;line-height:1.2}
.dest-choice small{display:block;font-size:12px;color:var(--mute);margin-top:4px;font-weight:650}
.dest-summary{display:flex;align-items:center;gap:14px;background:white;border:2px solid var(--ink);border-radius:16px;padding:12px}
.dest-summary .dest-art{flex:none;width:90px;height:70px;border-radius:9px}
.dest-summary .dest-info{flex:1;min-width:0}
.dest-summary b{font-size:23px;font-weight:900;display:block}
.dest-summary small{font-size:13px;color:var(--mute);display:block}
.dest-summary button{font-size:13px;font-weight:800;text-decoration:underline;min-height:44px;padding:4px}
.start select{font:inherit;color:var(--ink);width:100%;height:56px;border:2px solid var(--ink);border-radius:14px;background:#fff;padding:0 12px;font-size:16px;font-weight:700}
.dest-preview{overflow:hidden;border:2px solid var(--ink);border-radius:18px;background:#fff}
.dest-preview .dest-art{height:auto;aspect-ratio:16/9;width:100%;display:block}
.preview-caption{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.preview-caption b{font-size:24px;font-weight:900}
.preview-caption span{font-size:14px;font-weight:700;color:var(--mute)}
.preview-empty{min-height:180px;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mute);font-size:14px;background:#edf1f5}
.primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.duration{font-size:15px;font-weight:800;color:var(--blue);min-height:22px}
.budget-caption{font-size:13px;color:var(--mute);margin-top:-4px}
.start input[type=date]{font-size:15px;padding:0 8px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--sun);font-weight:900;margin-left:12px;padding:4px 6px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* daily overview: a continuous travel ledger, not another card grid */
.ov-head{margin:12px 0 22px}.ov-head h1{font-size:30px;font-weight:900}.ov-head p{color:var(--mute);margin-top:6px}
.ov-total{border-top:4px solid var(--ink);border-bottom:2px solid var(--ink);padding:16px 0;margin-bottom:22px}
.ov-total h2{font-size:22px;margin-bottom:12px}.ov-money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ov-money small{display:block;color:var(--mute);font-size:12px}.ov-money b{display:block;font-size:18px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.ov-key{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);padding-bottom:8px}
.ov-day{display:block;width:100%;text-align:left;border-top:1px solid #bac4d2;padding:17px 8px;min-height:106px}
.ov-day.is-today{background:#fff7d8;border-left:4px solid var(--sun)}.ov-date{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ov-date b{font-size:16px}.ov-date span{font-size:12px;color:var(--mute)}.ov-day .ov-money b{font-size:16px}.ov-note{font-size:13px;color:var(--mute);margin-top:9px;overflow-wrap:anywhere}
.pwa-info{margin-top:32px;padding:14px 0 2px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);line-height:1.6}
.pwa-info button{display:inline-block;font-size:13px;font-weight:800;text-decoration:underline;margin:8px 16px 0 0;min-height:32px}.pwa-info .warn{color:#a43225}.pwa-info small{display:block;font-size:11px;margin-top:5px}

<script>
const CATS=[
  {k:'food',n:'餐飲',e:'🍜',c:'#FF6B57'},
  {k:'move',n:'交通',e:'🚆',c:'#3F6FE0'},
  {k:'stay',n:'住宿',e:'🛏️',c:'#7C4DEB'},
  {k:'shop',n:'購物',e:'🛍️',c:'#FFC93C'},
  {k:'play',n:'玩樂',e:'🎟️',c:'#2BB3A3'},
  {k:'other',n:'其他',e:'🧾',c:'#8A94A6'}
];
const CAT_IN={k:'in',n:'收入',e:'💰',c:'#14795F'};
const catOf=k=>k==='in'?CAT_IN:(CATS.find(c=>c.k===k)||CATS[5]);
const PAL=[
  {bg:'#CFE6F3',ac:'#276F95'},{bg:'#F7E3B5',ac:'#8F5B12'},{bg:'#D5EBD3',ac:'#2F7A41'},
  {bg:'#F3D3D3',ac:'#B84A4A'},{bg:'#E0D8F2',ac:'#6A4FB5'},{bg:'#D9E2E8',ac:'#3A4F66'}
];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const p2=n=>String(n).padStart(2,'0');
const sum=TravelCore.total;
const entryDay=TravelCore.dateOf;
const dayStart=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
const daysOf=t=>Math.max(1,Math.round((dayStart(t.end||Date.now())-dayStart(t.start))/864e5)+1);
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const dayLabel=ts=>new Date(ts).toLocaleDateString('zh-HK',{month:'long',day:'numeric'});
const timeLabel=ts=>{const d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes())};
function range(t){
  const a=new Date(t.start),b=new Date(t.end||Date.now());
  const A=`${a.getFullYear()}.${p2(a.getMonth()+1)}.${p2(a.getDate())}`;
  if(dayStart(a)===dayStart(b))return A;
  const B=a.getFullYear()===b.getFullYear()?`${p2(b.getMonth()+1)}.${p2(b.getDate())}`:`${b.getFullYear()}.${p2(b.getMonth()+1)}.${p2(b.getDate())}`;
  return A+'–'+B;
}
function stats(t){return TravelCore.stats(t)}

/* ---------- storage (localStorage when available, memory otherwise) ---------- */
const KEY='lvtie.v1';
let mem=null;
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(!data||!Array.isArray(data.trips))throw Error('Invalid storage');return data}}catch(e){window.lvtieStorageError=true;window.lvtieLoadError=true}
  return mem||{trips:[]};
}
function save(){
  mem=S;
  if(window.lvtieLoadError){toast('無法讀取原有帳目，已停止覆寫。請先到備份設定匯出原始資料。');return false}
  try{localStorage.setItem(KEY,JSON.stringify(S));window.lvtieStorageError=false}catch(e){window.lvtieStorageError=true}
  updateStorageNotice();if(window.updatePwaUI)window.updatePwaUI();return !window.lvtieStorageError;
}

/* dates are 'YYYY-MM-DD' strings in local time */
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).getTime()};
const iso=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
const today=()=>iso(Date.now());
const idxOf=(t,day)=>Math.round((parseD(day)-parseD(t.startDate))/864e5)+1;
const nDays=t=>idxOf(t,t.endDate);
const dayList=TravelCore.days;
const dLabel=d=>new Date(parseD(d)).toLocaleDateString('zh-HK',{month:'long',day:'numeric',weekday:'short'});
const budNum=v=>{const s=String(v).replace(/,/g,'').trim();if(!s)return null;const n=Number(s);return Number.isFinite(n)&&n>0&&n<=999999999.99&&/^\d+(\.\d{1,2})?$/.test(s)?n:NaN};
function norm(t){
  if(!t.startDate)t.startDate=iso(t.start||Date.now());
  if(!t.endDate)t.endDate=iso(t.end||Date.now());
  if(t.endDate<t.startDate)t.endDate=t.startDate;
  if(t.status==='active')t.status='planned';
  t.plan=t.plan||{};t.entries=t.entries||[];
  t.entries.forEach(e=>{if(!e.date)e.date=iso(e.ts)});
  if(t.hkdRate===undefined)t.hkdRate=t.currency==='HKD'?1:null;
  if(t.snoozeUntil===undefined)t.snoozeUntil=0;
  if(t.budget===undefined)t.budget=null;
  if(t.dailyBudget===undefined)t.dailyBudget=null;
  return t;
}
let S=load();S.trips=(S.trips||[]).map(norm);

const ui={overviewId:null,detailId:null,pendingDates:null,pendingImport:null,editId:null,editTid:null,tab:'trip',type:'out',amt:'',cat:'food',note:'',page:0,turn:null,home:false,planId:null,ledgerId:null,day:null,dayFor:null,asked:{},lastToday:null,newStep:1,destId:null,pickFor:null,draft:{place:'',start:'',end:'',budget:'',dailyBudget:''}};
const tripById=id=>S.trips.find(t=>t.id===id);
const liveTrips=()=>S.trips.filter(t=>t.status!=='done'&&t.startDate<=today()&&today()<=t.endDate);
const inProg=()=>liveTrips()[0];
const overdue=()=>S.trips.filter(t=>t.status!=='done'&&t.endDate<today());
const upcoming=()=>S.trips.filter(t=>t.status!=='done'&&t.startDate>today()).sort((a,b)=>a.startDate<b.startDate?-1:1);
/* 今天有多於一段旅程時，不自動挑一段，交給 chooseTripView 讓用家選 */
const curTrip=()=>{const L=liveTrips(),t=ui.ledgerId?tripById(ui.ledgerId):(ui.home||L.length>1?null:L[0]);return t&&t.status!=='done'?t:null};
let lastDel=null;

/* ---------- sticker ---------- */
const INK='#14213D',RED='#D64A3A',GOLD='#E8C26A',GREY='#8A94A6';
/* Landmark drawings: 60 x 36 box, ground line at y = 30. */
const LM={
  tokyo:ac=>`<path d="M0 30L18 9L36 30Z" fill="${ac}"/><path d="M13.5 15.5L18 9L22.5 15.5L20 14L18 16L16 14Z" fill="#fff"/><path d="M43 30L48 5L53 30H50.5L48 14L45.5 30Z" fill="${RED}"/><rect x="44.5" y="13" width="7" height="2" fill="${RED}"/><rect x="45.4" y="19" width="5.2" height="1.1" fill="${RED}"/><rect x="47.7" y="1" width=".6" height="4.5" fill="${RED}"/>`,
  fuji:ac=>`<path d="M8 30L26 8L44 30Z" fill="${ac}"/><path d="M21.5 14.5L26 8L30.5 14.5L28 13L26 15L24 13Z" fill="#fff"/><path d="M34 30L45 16L56 30Z" fill="${ac}" opacity=".55"/>`,
  torii:ac=>`<path d="M0 30Q16 18 32 30Z" fill="${ac}" opacity=".35"/><path d="M14 11Q30 6 46 11L46 15Q30 10 14 15Z" fill="${RED}"/><rect x="20" y="16" width="20" height="2.2" fill="${RED}"/><rect x="22" y="14" width="2.6" height="16" fill="${RED}"/><rect x="35.4" y="14" width="2.6" height="16" fill="${RED}"/>`,
  osaka:ac=>`<rect x="14" y="25" width="32" height="5" fill="${GREY}"/><rect x="20" y="19" width="20" height="6" fill="#fff"/><path d="M17 19L30 13L43 19Z" fill="${ac}"/><rect x="24" y="12" width="12" height="5" fill="#fff"/><path d="M21 12L30 6L39 12Z" fill="${ac}"/><rect x="28.5" y="3" width="3" height="3" fill="${GOLD}"/>`,
  t101:ac=>{
    const seg=Array.from({length:8},(_,i)=>{const w=8.4-i*.35,y=23.6-i*2.7;return `<path d="M${30-w/2} ${y+2.7}L${30-w/2-.8} ${y}H${30+w/2+.8}L${30+w/2} ${y+2.7}Z" fill="${ac}" opacity="${i%2?.75:1}"/>`}).join('');
    return `<rect x="25" y="26" width="10" height="4" fill="${ac}"/>${seg}<rect x="29.6" y="0.5" width=".8" height="4.8" fill="${ac}"/>`;

function qrSvg(h){
  const n=11;let x=h||1,r='';
  const inF=(i,j)=>(i<4&&j<4)||(i>n-5&&j<4)||(i<4&&j>n-5);
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){
    x=(Math.imul(x,1664525)+1013904223)>>>0;
    if(!inF(i,j)&&((x>>>16)&1))r+=`<rect x="${i}" y="${j}" width="1" height="1"/>`;
  }
  const f=(i,j)=>`<path fill-rule="evenodd" d="M${i} ${j}h3v3h-3zM${i+1} ${j+1}v1h1v-1z"/>`;
  return `<svg viewBox="0 0 ${n} ${n}" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">${r}${f(0,0)}${f(n-3,0)}${f(0,n-3)}</svg>`;
}
function sticker(t,px){
  const h=hash(t.id),pal=PAL[h%PAL.length],rot=((h>>5)%7)-3,dx=((h>>8)%5)-2;
  const s=stats(t),len=[...t.name].length;
  const nm=len<=4?1.7:len<=6?1.4:len<=9?1.15:1;
  const segs=CATS.filter(c=>s.by[c.k]).map(c=>`<i style="flex:${s.by[c.k]};background:${c.c}"></i>`).join('');
  const so=fmt(s.so),sf=so.length>7?1.15:1.35;
  return `<div class="st" style="${px?`font-size:${px}px;`:''}--bg:${pal.bg};--ac:${pal.ac};transform:translateX(${dx*.12}em) rotate(${rot*.55}deg)">
    <div class="sh"><span>旅程紀錄</span><span>${esc(t.currency)}</span></div>
    <div class="sc">${scene(t.name,h,pal.ac)}<b class="nm" style="font-size:${nm}em">${esc(t.name)}</b></div>
    <div class="bar">${segs}</div>
    <div class="sf"><div class="sm"><small>${range(t)}</small><div class="am2"><div><small>支出</small><b style="font-size:${sf}em">${so}</b></div><div><small>收入</small><b>${s.si?'+'+fmt(s.si):'—'}</b></div></div></div><div class="qr">${qrSvg(h)}</div></div>
  </div>`;
}

/* ---------- views ---------- */
function tripCard(t,preview=false,act='plan'){
  const td=today();let badge,od=false;
  if(t.endDate<td){badge='已過回程日';od=true}
  else if(t.startDate>td)badge=`還有 ${Math.round((parseD(t.startDate)-parseD(td))/864e5)} 天出發`;
  else badge='旅程中';
  const c=countryOf(t),night=t.artVariant==='night',img=countryArt(c,night,artIndexOf(t));
  if(img){
    const s=stats(t),se=tripSeasonOf(t,c),tag=preview?'div':'button',L=[...t.name].length,hs=L<=4?'':L<=7?' ac-h-m':' ac-h-s';
    return `<${tag} class="tcard art-card${night?' night':''}" ${preview?'aria-hidden="true"':`data-act="${act}" data-id="${t.id}"`} style="background-image:url('${img}')">`+
      `<span class="ac-txt"><span class="ac-k">${esc(c.name)}</span><b class="ac-h${hs}">${esc(t.name)}</b><span class="ac-amt">${esc(t.currency)} ${fmt(s.so)}</span><span class="ac-m">${nDays(t)} 天 · ${t.entries.length} 筆</span></span>`+
      `${se?`<span class="ac-season" role="img" aria-label="季節：${se.label}" title="${se.label}">${SEASON_ICON[se.season]}</span>`:''}<span class="bdg ac-bdg ${od?'od':''}">${badge}</span></${tag}>`;
  }
  return `<button class="tcard" data-act="${act}" data-id="${t.id}"><div><b>${esc(t.name)}</b><small>${t.startDate.replace(/-/g,'.')}–${(t.startDate.slice(0,4)===t.endDate.slice(0,4)?t.endDate.slice(5):t.endDate).replace(/-/g,'.')} 共 ${nDays(t)} 天</small></div><span class="bdg ${od?'od':''}">${badge}</span></button>`;
}

/* 建立旅程時選的景點只對當時的國家有效；換國家就回到第一張。 */
const draftArtIndex=d=>ui.draft.artFor===d.id&&(ui.draft.artIndex===1||ui.draft.artIndex===2)?ui.draft.artIndex:0;
const draftNight=d=>ui.draft.artFor===d.id&&ui.draft.night===true;
function setDraftArt(patch){

function artCarousel(d){
  const idx=draftArtIndex(d),n=draftNight(d),N=d.arts.length;
  /* 無限循環：前面放最後一張的複製、後面放第一張的複製；真的第 i 張在位置 i+1 */
  const slide=(a,i,clone)=>`<figure class="car-slide${clone?' clone':''}"${clone?' aria-hidden="true"':` aria-label="${i+1} / ${N}：${esc(a.label)}"`}><img src="${countryArt(d,n,i)}" alt="${clone?'':`${esc(d.name)} ${esc(a.label)}${n?'夜景':'日景'}插畫`}"${i!==idx||clone?' loading="lazy"':''}><figcaption>${esc(a.label)}</figcaption></figure>`;
  const slides=(N>1?slide(d.arts[N-1],N-1,true):'')+d.arts.map((a,i)=>slide(a,i,false)).join('')+(N>1?slide(d.arts[0],0,true):'');
  return `<div class="art-car"><button type="button" class="car-nav prev" data-act="draftArtStep" data-v="-1" aria-label="上一張">‹</button><div class="car-view"><div class="car-track" id="art-track" tabindex="0" role="group" aria-roledescription="輪播" aria-label="旅程代表圖，左右滑動選擇，可循環" data-i="${idx}" data-n="${N}">${slides}</div></div><button type="button" class="car-nav next" data-act="draftArtStep" data-v="1" aria-label="下一張">›</button></div><div class="car-dots" role="group" aria-label="選擇景點">${d.arts.map((a,i)=>`<button type="button" class="${i===idx?'on':''}" aria-pressed="${i===idx}" aria-label="${esc(a.label)}" data-act="draftArt" data-v="${i}"></button>`).join('')}</div><div class="art-car-ctl"><div class="seg art-seg" role="group" aria-label="日景或夜景"><button type="button" class="${n?'':'on'}" aria-pressed="${!n}" data-act="draftVariant" data-v="day">日景</button><button type="button" class="${n?'on':''}" aria-pressed="${n}" data-act="draftVariant" data-v="night">夜景</button></div></div>`;
}
/* 輪播：render 後捲到目前那張（不用動畫）；滑動停下後只更新圓點，不整頁重繪。
   停在頭尾的複製張時，瞬間跳回對應的真實那張，看起來就是無限循環。 */
const carOffset=tr=>Number(tr.dataset.n)>1?1:0;
function carJump(tr,pos){if(!tr.style)return;tr.style.scrollBehavior='auto';tr.scrollLeft=pos*tr.clientWidth;tr.style.scrollBehavior=''}
function syncCarousel(){
  const tr=$('#art-track');if(!tr||!tr.clientWidth||!tr.style)return;
  carJump(tr,(Number(tr.dataset.i)||0)+carOffset(tr));
}
function carouselSettled(tr){
  const d=countryById(ui.destId);if(!d||!tr.clientWidth)return;
  const N=d.arts.length,off=N>1?1:0,pos=Math.round(tr.scrollLeft/tr.clientWidth);
  const i=((pos-off)%N+N)%N;
  if(pos!==i+off)carJump(tr,i+off);
  if(i===draftArtIndex(d)&&ui.draft.artFor===d.id)return;
  setDraftArt({artIndex:i});tr.dataset.i=i;
  document.querySelectorAll('.car-dots button').forEach((b,k)=>{b.classList.toggle('on',k===i);b.setAttribute('aria-pressed',k===i)});
}
let carTimer=null;
document.addEventListener('scroll',e=>{
  const tr=e.target;if(!tr||tr.id!=='art-track')return;
  clearTimeout(carTimer);carTimer=setTimeout(()=>carouselSettled(tr),120);
},true);

const rowOf=(e,editable,t)=>{

function rows(t,del){
  let h='',last='';
  [...t.entries].sort((a,b)=>b.ts-a.ts).forEach(e=>{

function fmtTyping(a){

function overviewTrip(){

function dailyTotals(t){return TravelCore.daily(t)}
function phaseLabel(t,d){return d<t.startDate?'行前支出':d>t.endDate?'回程後記錄':`第 ${idxOf(t,d)} 天`}
function categoryBars(t){
  const s=stats(t);

function budgetView(t){
  const s=stats(t),r=t.budget==null?null:Math.round((t.budget-s.so)*100)/100;
  const elapsed=Math.max(0,Math.min(nDays(t),idxOf(t,today()))),remain=Math.max(0,nDays(t)-elapsed);
  const spentToDate=sum(t.entries.filter(e=>e.type==='out'&&entryDay(e)>=t.startDate&&entryDay(e)<=today()&&entryDay(e)<=t.endDate));
  const futureKnown=Math.max(0,s.during-spentToDate);
  const forecast=elapsed&&remain&&t.startDate<=today()&&today()<=t.endDate?s.before+s.after+spentToDate+Math.max(futureKnown,spentToDate/elapsed*remain):null;
  return `<section class="budget-summary"><h2>預算進度</h2>${r===null?`<p class="muted">尚未設定總預算。<button class="text-action" data-act="plan" data-id="${t.id}">設定預算</button></p>`:`<div class="budget-line"><span>已用 ${fmt(s.so)}／${fmt(t.budget)} ${esc(t.currency)}</span><b class="${r<0?'over':''}">${r<0?'超支':'剩餘'} ${fmt(Math.abs(r))}</b></div><div class="budget-meter" role="progressbar" aria-label="總預算使用率" aria-valuenow="${Math.min(100,Math.round(s.so/t.budget*100))}" aria-valuemin="0" aria-valuemax="100"><i class="${r<0?'overfill':''}" style="width:${Math.min(100,s.so/t.budget*100)}%"></i></div>${hkd(t,Math.abs(r),r<0?'約超支':'約剩餘')}${forecast!==null?`<p class="muted">按已過 ${elapsed} 天的旅途中支出推算，全程約 ${esc(t.currency)} ${fmt(forecast)}${forecast>t.budget?'，可能超出預算':''}。只作參考，今天尚未完結。</p>`:''}`}${t.dailyBudget?`<p class="muted">每日預算 ${esc(t.currency)} ${fmt(t.dailyBudget)}；不套用於行前／回程後記錄。</p>`:''}<p class="muted">總預算按支出計算，不以收入抵銷。</p></section>`;
}

}
function switchBar(t){

  return `<button class="ghost switch-trip" data-act="switchTrip">今天還有${o.length===1?`「${esc(o[0].name)}」`:` ${o.length} 段旅程`} · 切換</button>`;

function ledgerView(t){

  <section class="list">${es.length?[...es].sort((a,b)=>b.ts-a.ts).map(e=>rowOf(e,true,t)).join(''):'<p class="empty-note">輸入金額、選分類，按「記一筆」。</p>'}</section><div class="foot"><button class="ghost" data-act="finish" data-id="${t.id}">完結旅程</button><button class="ghost" data-act="home">規劃其他行程</button></div></section>`;

const doneTrips=()=>S.trips.filter(t=>t.status==='done').sort((a,b)=>a.start-b.start);
/* 貼紙簿分組：日期完全相同 → 同一格等比縮小斜貼；被另一段完全包含 → 同一格，主 66%＋被包含 45%；部分重疊不合併 */
function doneGroups(){
  const T=doneTrips().slice().sort((a,b)=>a.startDate!==b.startDate?(a.startDate<b.startDate?-1:1):a.endDate!==b.endDate?(a.endDate>b.endDate?-1:1):a.start-b.start);
  const G=[];
  for(const t of T){
    const g=G.find(g=>g.start<=t.startDate&&t.endDate<=g.end);
    if(g)g.trips.push(t);else G.push({trips:[t],start:t.startDate,end:t.endDate});
  }
  for(const g of G){g.main=g.trips.filter(t=>t.startDate===g.start&&t.endDate===g.end);g.sub=g.trips.filter(t=>!g.main.includes(t))}
  return G;
}
const pageCount=()=>Math.max(1,Math.ceil(doneGroups().length/2));
const pageOfTrip=id=>{const i=doneGroups().findIndex(g=>g.trips.some(t=>t.id===id));return i<0?pageCount():Math.floor(i/2)+1};
const EQ_K={2:.74,3:.64,4:.56},MAIN_K=.66,SUB_K=.45;
function groupSlot(g){
  if(g.trips.length===1){const t=g.trips[0];return `<div class="slot"><button data-act="open" data-id="${t.id}" aria-label="${esc(t.name)}">${sticker(t)}</button></div>`}
  const md=d=>d.slice(5).replace('-','.'),it=[];
  if(!g.sub.length){
    const n=g.main.length,k=EQ_K[Math.min(n,4)],st=(1-k)/(n-1);
    g.main.forEach((t,i)=>it.push([t,k,i*18*st,i*17*st,0]));
  }else{
    const mk=g.main.length>1?MAIN_K-.04:MAIN_K,W=18*SUB_K,H=17*SUB_K,sx=18-W-.4,sy=17-H-.4;
    g.main.forEach((t,i)=>it.push([t,mk,.6+i*1.2,.6+i*1.2,0]));
    const spots=[[sx,sy],[sx,sy-H-.5],[sx-W-.5,sy]];
    g.sub.forEach((t,j)=>{const p=spots[j]||[sx-(j-2)*1.2,sy-(j-2)*1.2];it.push([t,SUB_K,p[0],p[1],1])});
  }
  const btn=it.map(([t,k,x,y,sub])=>`<button class="${sub?'sub':''}" data-act="open" data-id="${t.id}" aria-label="${esc(t.name)}" style="--k:${k};left:calc(var(--u) * ${x.toFixed(2)});top:calc(var(--u) * ${y.toFixed(2)})">${sticker(t)}</button>`).join('');
  const cap=g.sub.length?`${esc(g.main.map(t=>t.name).join('、'))} ${md(g.start)}–${md(g.end)} · 含 ${g.sub.length} 段旅程`:`同期 ${g.main.length} 段旅程 · ${md(g.start)}–${md(g.end)}`;
  return `<div class="slot multi"><div class="grp">${btn}</div><p class="grp-cap">${cap}</p></div>`;
}
function bookView(){
  const d=doneTrips();
  if(!d.length||ui.page<=0){
    ui.page=0;
    return `<section class="bk">
      <button class="cover" data-act="openBook" ${d.length?'':'disabled'} aria-label="翻開貼紙簿">
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20"/><ellipse cx="24" cy="24" rx="8" ry="20"/><path d="M4 24h40M7 14h34M7 34h34"/></svg>
        <b class="ct">旅貼</b><span class="cs">旅程帳本</span>

    <div class="pg"><button data-act="page" data-d="-1" aria-label="上一頁">‹</button><p>第 ${pg} 頁，共 ${total} 頁</p><button data-act="page" data-d="1" aria-label="下一頁" ${pg>=total?'disabled':''}>›</button></div>
  </section>`;
}
function dayBlocks(t){
  const rows=dailyTotals(t),mx=Math.max(1,...rows.map(r=>r.out));
  return rows.map(r=>{const es=t.entries.filter(e=>entryDay(e)===r.day);return `<div class="dayh"><b>${phaseLabel(t,r.day)} ${dLabel(r.day)}</b><span>支出 ${fmt(r.out)}${r.income?' 收入 '+fmt(r.income):''}</span></div><div class="dbar"><i style="width:${r.out/mx*100}%"></i></div>${t.plan[r.day]?`<p class="dnote">行程：${esc(t.plan[r.day])}</p>`:''}${es.length?es.sort((a,b)=>a.ts-b.ts).map(e=>rowOf(e,false,t)).join(''):'<p class="empty-day">沒有記錄</p>'}`}).join('');
}
function detailView(t){

      <button class="ghost danger" data-act="askdel" data-id="${t.id}">刪除這張貼紙</button>
    </div>
  </div></div>`;
}

/* ---------- layer / toast ---------- */
let layerFocus=null;
const showLayer=h=>{const l=$('#layer');if(!l.classList.contains('show'))layerFocus=document.activeElement;l.innerHTML=h;l.classList.add('show');l.setAttribute('role','dialog');l.setAttribute('aria-modal','true');l.setAttribute('aria-label','旅貼對話視窗');document.body.classList.add('modal-open');$('#view').inert=true;$('.tabs').inert=true;const first=l.querySelector('button,input,select');if(first)first.focus({preventScroll:true})};
const hideLayer=()=>{const l=$('#layer');l.classList.remove('show');l.innerHTML='';document.body.classList.remove('modal-open');$('#view').inert=false;$('.tabs').inert=false;ui.editId=null;ui.editTid=null;ui.pendingImport=null;ui.pendingDates=null;ui.detailId=null;if(layerFocus&&layerFocus.isConnected)layerFocus.focus({preventScroll:true})};

let tt;
function toast(msg,undo){
  const el=$('#toast');
  el.innerHTML=esc(msg)+(undo?'<button data-act="undo">復原</button>':'');
  el.classList.add('show');clearTimeout(tt);
  tt=setTimeout(()=>el.classList.remove('show'),undo?4500:1600);
}
function dialog(title,text,okLabel,okAct,id,danger){

}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  let h;
  if(ui.tab==='book')h=bookView();
  else if(ui.tab==='overview')h=overviewView();
  else if(ui.pickFor)h=destinationPicker(true);
  else if(ui.planId&&tripById(ui.planId))h=planView(tripById(ui.planId));
  else{ui.planId=null;const t=curTrip();h=t?ledgerView(t):(!ui.home&&liveTrips().length>1?chooseTripView():planningView())}

function key(k){
  let a=ui.amt;
  if(k==='b')a=a.slice(0,-1);
  else if(k==='.'){if(a.includes('.'))return;a=(a||'0')+'.'}
  else{if(k==='00'&&!a)return;if(a==='0')a='';a+=k}
  if(a.split('.')[0].length>9)return;
  const m=a.split('.');if(m[1]&&m[1].length>2)return;
  ui.amt=a;
  $('#amtv').textContent=a?fmtTyping(a):'0';

}

  const detail=ui.detailId,type=$('#edit-type').value;
  Object.assign(e,{amt:amount,date,ts,type,cat:type==='in'?'in':$('#edit-cat').value,note:$('#edit-note').value.trim()});
  if(ui.ledgerId===t.id){ui.day=date;ui.dayFor=t.id}lastDel=null;save();hideLayer();render();if(detail){ui.detailId=detail;showLayer(detailView(t))}toast('記錄已修改');
}
function downloadFile(content,name,mime){
  const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function exportJSON(){
  const data={format:'lvtie-backup',version:1,exportedAt:new Date().toISOString(),data:S};
  downloadFile(JSON.stringify(data),'旅貼備份-'+today()+'.json','application/json');
  toast('已建立備份，請確認已儲存檔案');
}
function exportRaw(){
  try{const raw=localStorage.getItem(KEY);if(raw===null){toast('找不到原始儲存資料');return}downloadFile(raw,'旅貼原始資料-'+today()+'.txt','text/plain;charset=utf-8')}catch(e){toast('瀏覽器不允許讀取原始儲存資料')}
}
function settingsView(){
  showLayer(`<div class="sheet"><div class="wrap settings"><div class="hd"><h1>備份與設定</h1><button class="ghost" data-act="close">關閉</button></div><p>帳目只在這個瀏覽器保存，沒有雲端同步。換裝置或清除網站資料前，先存一份 JSON 備份。</p><section><h2>把旅程帶走</h2><div class="acts"><button class="primary" data-act="exportJSON">匯出 JSON 備份</button><button class="ghost" data-act="exportCSV">匯出 CSV 帳目</button></div><p class="muted">JSON 可還原帳目與行程；CSV 適合試算表，不支援還原。匯出後請確認檔案已存好，內容包含你的私人旅程資料。</p></section><section><h2>從備份帶回來</h2><label class="field">選擇 JSON 備份<input id="backup-file" type="file" accept=".json,application/json"></label><p class="muted">先驗證，再確認合併。不覆蓋現有旅程；相同資料不重複加入，有衝突則保留為另一趟旅程。上限 50 MB。</p><p id="import-error" class="over" role="alert"></p></section><section><h2>本機儲存</h2><p id="persist-status" class="muted">持久儲存可減少系統自動回收資料的機會，但不能代替備份。</p><button class="ghost" data-act="persist">申請持久儲存</button>${window.lvtieLoadError?'<p class="storage-alert">原有資料讀取失敗，為避免覆寫，已暫停儲存及匯入。請匯出原始檔並保留，再尋求協助；不要清除網站資料。</p><button class="ghost" data-act="exportRaw">匯出原始資料</button>':''}</section><aside id="pwa-info" class="pwa-info" aria-live="polite"></aside><p class="muted">旅貼 · 2026-10-24 carousel-1</p></div></div>`);
  if(window.updatePwaUI)window.updatePwaUI();
  if(navigator.storage?.persisted)navigator.storage.persisted().then(ok=>{const el=$('#persist-status');if(el)el.textContent=ok?'此瀏覽器已授予持久儲存。手動清除資料或換裝置仍會遺失帳目，請定期備份。':'尚未獲授持久儲存，可在下方申請。是否批准由瀏覽器決定，請定期備份。'}).catch(()=>{});
}
async function requestPersistence(){
  const el=$('#persist-status');if(!el)return;
  if(!navigator.storage?.persist){el.textContent='此瀏覽器不提供持久儲存申請，請使用 JSON 備份。';return}
  try{const ok=await navigator.storage.persist();el.textContent=ok?'已獲授持久儲存；手動清除資料仍會刪除帳目，請定期備份。':'瀏覽器未批准申請；帳目仍使用一般本機儲存，請匯出 JSON 備份。'}catch(e){el.textContent='未能申請持久儲存，請使用 JSON 備份。'}
}
async function readImport(file){
  if(!file)return;const error=$('#import-error');
  if(window.lvtieLoadError){if(error)error.textContent='原有資料讀取失敗，請先匯出原始資料，現在不能合併。';return}
  try{
    if(file.size>50*1024*1024)throw Error('檔案超過 50 MB 上限');
    const text=await file.text(),data=TravelCore.validateBackup(JSON.parse(text.replace(/^﻿/,'')));
    const result=TravelCore.merge(S,data,uid);ui.pendingImport=data;
    const n=data.trips.reduce((n,t)=>n+t.entries.length,0);
    dialog('合併這份備份？',`包含 ${data.trips.length} 趟旅程、${n} 筆帳目。將加入 ${result.added} 趟，略過 ${result.skipped} 趟相同資料；其中 ${result.copies} 趟同 ID 的不同版本會以副本保留。原有旅程不會被覆蓋。`,'確認合併','confirmImport');
  }catch(e){ui.pendingImport=null;if(error&&error.isConnected)error.textContent='未有更改帳目。'+(e instanceof SyntaxError?'檔案不是有效 JSON。':e.message);const input=$('#backup-file');if(input)input.value=''}
}
function confirmImport(){
  if(!ui.pendingImport||window.lvtieLoadError)return;
  try{
    const result=TravelCore.merge(S,ui.pendingImport,uid);
    // Commit only after the complete new state has been written successfully.
    localStorage.setItem(KEY,JSON.stringify(result.data));S=result.data;mem=S;window.lvtieStorageError=false;lastDel=null;
    hideLayer();render();settingsView();const msg=$('#import-error');if(msg){msg.className='import-success';msg.textContent=`合併完成：加入 ${result.added} 趟，略過 ${result.skipped} 趟相同資料。`}
  }catch(e){showLayer(`<div class="dialog"><div class="dlg"><h2>未能匯入</h2><p>沒有更改原有帳目。瀏覽器儲存可能已滿或被封鎖，請先匯出現有資料。</p><button class="ghost" data-act="settings">返回備份設定</button></div></div>`)}
}

function legacyRangeNote(t){return nDays(t)>120?'<p class="budget-caption">舊旅程超過 120 天；顯示最初 120 天及所有有帳目或行程備註的日期。日均按完整旅程天數計算，所有帳目均保留。</p>':''}

ui.lastToday=today();
render();
checkOverdue();
</script>
<script src="./pwa.js" defer></script>
